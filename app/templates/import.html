{% extends "base.html" %}
{% block content %}
<p class="help">
  로컬 SQLite 파일(<code>dashboard.db</code>)을 올리면 앱 테이블과 같은 이름의 테이블을 1,000행씩 현재 DB로 옮깁니다.
  이미 있는 id 는 건너뛰고, 끝나면 id 시퀀스를 최댓값으로 맞춥니다. 같은 파일을 다시 올려도 안전합니다. 최대 {{ max_mb }}MB.
</p>
<div class="card" style="margin-bottom:12px">
  <form id="f" class="imp-form">
    <input type="file" id="file" accept=".db,.sqlite,.sqlite3" required>
    <button type="submit" id="go">가져오기 시작</button>
  </form>
  <div id="msg" class="sub" aria-live="polite"></div>
</div>

<div class="card" id="job" hidden>
  <div class="k"><span id="state" class="badge"></span><span id="fname"></span><span id="elapsed" class="sub"></span></div>
  <progress id="bar" class="imp-bar" max="100" value="0"></progress>
  <div class="v"><span id="ins">0</span><small>/ <span id="tot">0</span> 행 넣음</small></div>
  <div class="sub" id="detail"></div>
  <div id="err" class="badge err" hidden></div>
  <table class="imp-tbl"><thead><tr><th>테이블</th><th>상태</th><th>넣은 행</th><th>건너뜀</th><th>전체</th></tr></thead>
    <tbody id="rows"></tbody></table>
  <ul id="notes" class="sub"></ul>
</div>
{% endblock %}

{% block scripts %}
<style>
  .imp-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .imp-form button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 8px 20px; font: inherit; cursor: pointer; }
  .imp-form button:disabled { opacity: .5; cursor: default; }
  .imp-bar { width: 100%; height: 14px; margin: 10px 0; }
  .imp-tbl { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .imp-tbl th, .imp-tbl td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--border); }
  .imp-tbl th:first-child, .imp-tbl td:first-child { text-align: left; }
</style>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var timer = null, LABEL = {uploading: '업로드 중', running: '가져오는 중', done: '완료', failed: '실패'};
  var fmt = function (n) { return Number(n).toLocaleString('ko-KR'); };
  function setMsg(t) { $('msg').textContent = t || ''; }

  function render(j) {
    if (!j || j.status === 'idle') return false;
    $('job').hidden = false;
    var st = $('state'); st.textContent = LABEL[j.status] || j.status;
    st.className = 'badge' + (j.status === 'failed' ? ' err' : (j.status === 'running' || j.status === 'uploading') ? ' warn' : '');
    $('fname').textContent = j.filename || '';
    $('elapsed').textContent = j.elapsed + '초 경과';
    var done = j.inserted + j.skipped;
    $('bar').value = j.total ? Math.round(done * 100 / j.total) : (j.status === 'done' ? 100 : 0);
    $('ins').textContent = fmt(j.inserted); $('tot').textContent = fmt(j.total);
    $('detail').textContent = '처리 ' + fmt(done) + ' / ' + fmt(j.total) + '행 (이미 있어 건너뜀 ' + fmt(j.skipped) + ')';
    var e = $('err'); e.hidden = !j.error; e.textContent = j.error || '';
    var rows = $('rows'); rows.textContent = '';
    Object.keys(j.tables).forEach(function (name) {
      var t = j.tables[name], tr = document.createElement('tr');
      [name, t.state, fmt(t.inserted), fmt(t.skipped), fmt(t.total)].forEach(function (v) {
        var td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
      });
      rows.appendChild(tr);
    });
    var notes = $('notes'); notes.textContent = '';
    (j.notes || []).forEach(function (n) { var li = document.createElement('li'); li.textContent = n; notes.appendChild(li); });
    return j.status === 'running' || j.status === 'uploading';
  }

  function poll() {
    fetch('/admin/import/status', {cache: 'no-store'}).then(function (r) { return r.json(); }).then(function (j) {
      if (render(j)) { timer = setTimeout(poll, 1500); } else { timer = null; $('go').disabled = false; }
    }).catch(function () { timer = setTimeout(poll, 3000); });
  }

  $('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var file = $('file').files[0]; if (!file) return;
    $('go').disabled = true; setMsg('업로드 중… 0%');
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/admin/import/upload');
    xhr.setRequestHeader('X-Filename', encodeURIComponent(file.name));
    xhr.upload.onprogress = function (e) { if (e.lengthComputable) setMsg('업로드 중… ' + Math.round(e.loaded * 100 / e.total) + '%'); };
    xhr.onload = function () {
      if (xhr.status === 202) { setMsg('업로드 완료 — 백그라운드에서 가져오는 중입니다. 이 화면을 닫아도 계속됩니다.'); if (!timer) poll(); }
      else { var d = ''; try { d = JSON.parse(xhr.responseText).detail; } catch (x) {} setMsg('실패: ' + (d || xhr.status)); $('go').disabled = false; }
    };
    xhr.onerror = function () { setMsg('업로드 실패(네트워크)'); $('go').disabled = false; };
    xhr.send(file);        // File 을 그대로 본문으로 — 브라우저가 파일을 스트리밍해 보낸다
  });
  poll();                  // 페이지를 다시 열어도 진행 중인 작업을 이어서 보여준다
})();
</script>
{% endblock %}
